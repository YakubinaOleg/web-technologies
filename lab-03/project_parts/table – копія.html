<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 2 - Картина Мондріана</title>
</head>
<body align="center">

    <h2>Завдання 2. Композиція з червоним, синім і жовтим</h2>

    <!-- Таблиця з чорним фоном і відстаню між ячейками 8px для імітації ліній -->
    <table bgcolor="#000000" cellspacing="8" cellpadding="0" width="500" height="500" align="center">

        <!-- РЯДОК 1 -->
        <tr height="60">
            <td width="50" bgcolor="#ffffff"></td>
            <!-- Великий червоний квадрат почнеться тут і розтягнеться на 3 рядки вниз -->
            <td width="240" rowspan="3" bgcolor="#ff5b2d"></td>
            <td width="90" bgcolor="#fffa69"></td>
            <td width="120" bgcolor="#fffa69"></td>
        </tr>

        <!-- РЯДОК 2 -->
        <tr height="140">
            <td bgcolor="#ffffff"></td>
            <!-- Крайня права колонка розбита на білий і квадратний блоки -->
            <td bgcolor="#ffffff"></td>
            <td bgcolor="#ffffff"></td>
        </tr>

        <!-- РЯДОК 3 -->
        <tr height="60">
            <td bgcolor="#ffffff"></td>
            <td bgcolor="#ffffff"></td>
            <td bgcolor="#ffffff"></td>
        </tr>

        <!-- РЯДОК 4 -->
        <tr height="100">
            <!-- ТЕМНО-СІРИЙ/ЧОРНИЙ БЛОК знизу ліворуч (об'єднує 2 колонки) -->
            <td colspan="2" bgcolor="#2b2b2a"></td>
            <td bgcolor="#ffffff"></td>
            <!-- Великий синій квадрат (об'єднує 2 рядки у правій частині) -->
            <td rowspan="2" bgcolor="#074481"></td>
        </tr>

        <!-- РЯДОК 5 -->
        <tr height="140">
            <td bgcolor="#ffffff"></td>
            <td bgcolor="#ffffff"></td>
            <td bgcolor="#ffffff"></td>
        </tr>

    </table>

    <br>
    <p><a href="../index.html">Повернутись на головну</a></p>

</body>
</html>
