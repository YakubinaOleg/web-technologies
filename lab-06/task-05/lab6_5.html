<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 5 - Погода</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="scene">

        <div class="forecast">
            <div class="day"><div class="day-name">Mon</div><div class="day-temp">17°</div></div>
            <div class="day"><div class="day-name">Tue</div><div class="day-temp">19°</div></div>
            <div class="day"><div class="day-name">Wed</div><div class="day-temp">16°</div></div>
            <div class="day"><div class="day-name">Thu</div><div class="day-temp">18°</div></div>
            <div class="day"><div class="day-name">Fri</div><div class="day-temp">21°</div></div>
        </div>

        <div class="card">
            <span class="temp-big">17</span>
        </div>

        <img class="cloud" src="img/cloud.png" alt="Хмара">

        <div class="arrows">
            <button class="arrow" type="button">&larr;</button>
            <button class="arrow" type="button">&rarr;</button>
        </div>

    </div>

</body>
</html>
