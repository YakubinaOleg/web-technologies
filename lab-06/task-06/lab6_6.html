<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Popup</title>
    <link rel="icon" href="icons/favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body class="page">

    <header class="header">
        <a class="header-link" href="#">Mail</a>
        <a class="header-link" href="#">Images</a>

        <div class="popup-wrapper">
            <input class="popup-toggle" id="popup-toggle" type="checkbox">
            <label class="popup-button" for="popup-toggle">
                <img class="popup-button-icon" src="icons/popup-button.png" alt="Apps">
            </label>

            <div class="popup" tabindex="0">
                <div class="popup-grid">
                    <a class="popup-item" href="#">
                        <img class="popup-item-icon" src="icons/calendar.png" alt="">
                        <span class="popup-item-name">Calendar</span>
                    </a>
                    <a class="popup-item" href="#">
                        <img class="popup-item-icon" src="icons/mail.png" alt="">
                        <span class="popup-item-name">Mail</span>
                    </a>
                    <a class="popup-item" href="#">
                        <img class="popup-item-icon" src="icons/news.png" alt="">
                        <span class="popup-item-name">News</span>
                    </a>
                    <a class="popup-item" href="#">
                        <img class="popup-item-icon" src="icons/maps.png" alt="">
                        <span class="popup-item-name">Map</span>
                    </a>
                    <a class="popup-item" href="#">
                        <img class="popup-item-icon" src="icons/files.png" alt="">
                        <span class="popup-item-name">Files</span>
                    </a>
                    <a class="popup-item" href="#">
                        <img class="popup-item-icon" src="icons/contacts.png" alt="">
                        <span class="popup-item-name">Contacts</span>
                    </a>
                    <a class="popup-item" href="#">
                        <img class="popup-item-icon" src="icons/tanslation.png" alt="">
                        <span class="popup-item-name">Translate</span>
                    </a>
                    <a class="popup-item" href="#">
                        <img class="popup-item-icon" src="icons/videos.png" alt="">
                        <span class="popup-item-name">Videos</span>
                    </a>
                    <a class="popup-item" href="#">
                        <img class="popup-item-icon" src="icons/search.png" alt="">
                        <span class="popup-item-name">Search</span>
                    </a>
                    <a class="popup-item" href="#">
                        <img class="popup-item-icon" src="icons/photos.png" alt="">
                        <span class="popup-item-name">Photos</span>
                    </a>
                    <a class="popup-item" href="#">
                        <img class="popup-item-icon" src="icons/apps.png" alt="">
                        <span class="popup-item-name">Apps</span>
                    </a>
                    <a class="popup-item" href="#">
                        <img class="popup-item-icon" src="icons/documents.png" alt="">
                        <span class="popup-item-name">Documents</span>
                    </a>
                </div>


                <input class="more-toggle" id="more-toggle" type="checkbox">

                <div class="popup-grid popup-extra">
                    <a class="popup-item" href="#">
                        <img class="popup-item-icon" src="icons/chat.png" alt="">
                        <span class="popup-item-name">Chat</span>
                    </a>
                    <a class="popup-item" href="#">
                        <img class="popup-item-icon" src="icons/classroom.png" alt="">
                        <span class="popup-item-name">Classroom</span>
                    </a>
                    <a class="popup-item" href="#">
                        <img class="popup-item-icon" src="icons/collection.png" alt="">
                        <span class="popup-item-name">Collection</span>
                    </a>
                    <a class="popup-item" href="#">
                        <img class="popup-item-icon" src="icons/mars.png" alt="">
                        <span class="popup-item-name">Mars</span>
                    </a>
                    <a class="popup-item" href="#">
                        <img class="popup-item-icon" src="icons/blogs.png" alt="">
                        <span class="popup-item-name">Blogs</span>
                    </a>
                    <a class="popup-item" href="#">
                        <img class="popup-item-icon" src="icons/promos.png" alt="">
                        <span class="popup-item-name">Promos</span>
                    </a>
                </div>

                <label class="popup-more" for="more-toggle">
                    <span class="popup-more-closed">More</span>
                    <span class="popup-more-open">Even more from Kottans</span>
                </label>
            </div>
        </div>

        <a class="header-link header-bell" href="#">
            <img class="header-bell-icon" src="icons/bell.png" alt="Notifications">
        </a>
    </header>

</body>
</html>
